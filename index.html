<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>喵星勇士：歐趴大作戰</title>
    <style>
        body { 
            background-color: #222; display: flex; justify-content: center; 
            align-items: center; height: 100vh; margin: 0; 
            font-family: "微軟正黑體", sans-serif; user-select: none; 
        }
        
        #game-window { 
            width: 800px; height: 600px; background-image: url('bg.jpg'); 
            background-size: cover; background-position: center; 
            position: relative; border: 6px solid #444; border-radius: 12px; 
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }

        #top-bar { 
            background: rgba(0, 0, 0, 0.7); color: #fff; padding: 15px 20px; 
            font-size: 18px; font-weight: bold; display: flex; justify-content: space-between;
            position: relative; z-index: 10;
        }

        #auto-status { color: #ffeb3b; font-size: 14px; margin-left: 5px; display: none; }

        .game-btn {
            background: #ffaa00; border: 3px solid #fff; border-radius: 8px;
            padding: 10px 20px; font-size: 20px; font-weight: bold; cursor: pointer;
            color: #333; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .game-btn:active { transform: scale(0.95); background: #ffcc00; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        /* 小窩畫面 */
        #room-screen { width: 100%; height: 100%; position: absolute; top:0; left:0; }
        #cat { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 250px; cursor: pointer; }
        #cat:active { transform: translateX(-50%) scale(0.92); }
        
        /* 底部按鈕區與推薦戰力 */
        .room-bottom-right { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; }
        .recommend-text { color: #ffeb3b; font-size: 16px; font-weight: bold; margin-bottom: 8px; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 8px;}
        .room-buttons { display: flex; gap: 10px; }
        
        #btn-go-battle { background: #ff4757; color: white; }
        #btn-go-shop { background: #3498db; color: white; }

        /* 戰鬥畫面 */
        #battle-screen { width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; position: absolute; top: 0; left: 0; }
        .hp-board { display: flex; justify-content: space-between; padding: 70px 20px 20px 20px; color: white; font-size: 20px; font-weight: bold; }
        .hp-bar-bg { width: 250px; height: 20px; background: #333; border: 2px solid #fff; margin-top: 5px; border-radius: 10px; overflow: hidden;}
        .hp-bar-fill { height: 100%; transition: width 0.3s ease; }
        .green { background: #2ecc71; }
        .red { background: #e74c3c; }
        #boss-name-display { color: #ff4757; text-shadow: 1px 1px 0 #000; }

        #battle-cat { position: absolute; bottom: 150px; left: 50px; width: 200px; }
        #boss { position: absolute; bottom: 120px; right: 50px; width: 300px; }
        #battle-ui { position: absolute; bottom: 0; width: 100%; background: #222; border-top: 4px solid #fff; padding: 15px; box-sizing: border-box; }
        #battle-log { color: #ffeb3b; font-size: 18px; margin-bottom: 10px; height: 24px; }

        /* 商店畫面 */
        #shop-screen { width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; position: absolute; top: 0; left: 0; padding-top: 30px; box-sizing: border-box; color: white; }
        .shop-title { text-align: center; color: #ffaa00; font-size: 32px; margin-top: 10px; text-shadow: 2px 2px 0 #000; }
        .shop-items-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap;}
        .shop-item-card { background: #333; border: 4px solid #555; border-radius: 15px; padding: 15px; text-align: center; width: 200px; }
        .shop-item-card h3 { color: #2ecc71; margin-top: 0; font-size: 22px;}
        .shop-item-card p { color: #ccc; height: 50px; font-size: 14px;}
        #btn-leave-shop { position: absolute; bottom: 20px; right: 20px; background: #95a5a6; }

        /* 動效 */
        .shake { animation: shakeAnim 0.3s; }
        @keyframes shakeAnim { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); filter: brightness(2); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        .float-heart { position: absolute; color: #ff4757; font-size: 32px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 5;}
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="game-window">
        <div id="top-bar">
            <span>⭐ 綜合戰力：<span id="total-power" style="color:#ffaa00;">150</span></span>
            <span>❤️ 攻：<span id="score">10</span> <span id="auto-status">(💻x0)</span></span>
            <span>❤️ 血：<span id="max-hp-display">100</span></span>
            <span>💰 幣：<span id="coins">0</span></span>
        </div>
        
        <div id="room-screen">
            <img id="cat" src="cat.png" alt="橘貓">
            
            <!-- 右下角按鈕區與推薦戰力 -->
            <div class="room-bottom-right">
                <div class="recommend-text">⚠️ 推薦戰力：<span id="rec-power">150</span></div>
                <div class="room-buttons">
                    <button id="btn-go-shop" class="game-btn">🛒 逛福利社</button>
                    <button id="btn-go-battle" class="game-btn">⚔️ 挑戰大魔王</button>
                </div>
            </div>
        </div>

        <div id="battle-screen">
            <div class="hp-board">
                <div>喵星勇士 HP <div class="hp-bar-bg"><div id="cat-hp" class="hp-bar-fill green" style="width:100%"></div></div></div>
                <div style="text-align: right;">
                    <span id="boss-name-display">死當大魔王 Lv.1</span> HP 
                    <div class="hp-bar-bg"><div id="boss-hp" class="hp-bar-fill red" style="width:100%"></div></div>
                </div>
            </div>
            <img id="battle-cat" src="cat.png">
            <img id="boss" src="boss.png">
            <div id="battle-ui">
                <div id="battle-log">遭遇了死當大魔王！請選擇行動。</div>
                <div>
                    <button id="btn-attack" class="game-btn action-btn">🐾 貓爪攻擊</button>
                    <button id="btn-heal" class="game-btn action-btn">🥫 喝冰美式(補血)</button>
                    <button id="btn-escape" class="game-btn action-btn" style="background:#ccc;">🏃 逃跑</button>
                </div>
            </div>
        </div>

        <div id="shop-screen">
            <h1 class="shop-title">🛒 喵星福利社</h1>
            <div class="shop-items-container">
                <div class="shop-item-card">
                    <div style="font-size: 40px;">📝</div>
                    <h3>考古題秘笈</h3>
                    <p>永久增加 15 點攻擊力</p>
                    <button id="buy-atk" class="game-btn">💰 200 購買</button>
                </div>
                <div class="shop-item-card">
                    <div style="font-size: 40px;">📚</div>
                    <h3>厚重原文書</h3>
                    <p>永久增加 50 點最大血量</p>
                    <button id="buy-hp" class="game-btn">💰 300 購買</button>
                </div>
                <div class="shop-item-card">
                    <div style="font-size: 40px;">💻</div>
                    <h3>爆肝資工室友</h3>
                    <p>每秒自動幫你點擊 +1 攻擊力</p>
                    <button id="buy-auto" class="game-btn" style="background: #e74c3c;">💰 800 聘用</button>
                </div>
            </div>
            <button id="btn-leave-shop" class="game-btn">🚪 回小窩</button>
        </div>
    </div>

    <script>
// --- 核心數值 ---
        let score = 10; 
        let coins = 0; 
        let roommates = 0; 
        let catMaxHP = 100, catCurrentHP = 100;
        
        // ★ 魔王數值「不改」，保持 V1.1 的平衡 ★
        let bossLevel = 1;         
        let bossBaseDamage = 8;     
        let bossMaxHP = 150, bossCurrentHP = 150; 
        
        // ★ 初始推薦戰力配合新公式，下調至 120 ★
        let recommendPowerValue = 120; 

        // 綁定 UI
        const scoreDisplay = document.getElementById('score');
        const coinsDisplay = document.getElementById('coins'); 
        const maxHpDisplay = document.getElementById('max-hp-display');
        const totalPowerDisplay = document.getElementById('total-power');
        const recPowerDisplay = document.getElementById('rec-power');
        const autoStatus = document.getElementById('auto-status');
        const bossNameDisplay = document.getElementById('boss-name-display'); 
        
        const roomScreen = document.getElementById('room-screen');
        const battleScreen = document.getElementById('battle-screen');
        const shopScreen = document.getElementById('shop-screen');
        const battleLog = document.getElementById('battle-log');
        
        const catHpBar = document.getElementById('cat-hp');
        const bossHpBar = document.getElementById('boss-hp');
        const bossImg = document.getElementById('boss');
        const battleCatImg = document.getElementById('battle-cat');

        // 更新血條
        function updateHPBar() {
            catHpBar.style.width = (catCurrentHP / catMaxHP * 100) + '%';
            bossHpBar.style.width = (bossCurrentHP / bossMaxHP * 100) + '%';
        }

        // ★ 戰力演算法修改：大幅降低攻擊力佔比 (改為 x2) ★
        function refreshTotalPower() {
            let currentPower = (score * 2) + catMaxHP;
            totalPowerDisplay.innerText = currentPower;
            
            if(currentPower < recommendPowerValue) {
                totalPowerDisplay.style.color = "#e74c3c"; // 戰力不足：紅
            } else {
                totalPowerDisplay.style.color = "#2ecc71"; // 戰力達標：綠
            }
        }

        // 自動掛機
        setInterval(() => {
            if (roommates > 0) {
                score += roommates; 
                scoreDisplay.innerText = score;
                refreshTotalPower(); 
            }
        }, 1000);

        // 摸貓咪
        document.getElementById('cat').addEventListener('click', (e) => {
            score += 2; 
            scoreDisplay.innerText = score;
            refreshTotalPower();
            
            const heart = document.createElement('div');
            heart.innerText = '❤️ +2';
            heart.className = 'float-heart';
            heart.style.left = `${e.clientX - document.getElementById('game-window').getBoundingClientRect().left - 20}px`;
            heart.style.top = `${e.clientY - document.getElementById('game-window').getBoundingClientRect().top - 20}px`;
            roomScreen.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        });

        // 導航
        document.getElementById('btn-go-battle').addEventListener('click', () => {
            roomScreen.style.display = 'none';
            battleScreen.style.display = 'block';
            battleLog.innerText = `戰鬥開始！Lv.${bossLevel} 的大魔王出現了！`;
            updateHPBar(); 
        });
        document.getElementById('btn-go-shop').addEventListener('click', () => {
            roomScreen.style.display = 'none'; shopScreen.style.display = 'block';
        });
        document.getElementById('btn-leave-shop').addEventListener('click', () => {
            shopScreen.style.display = 'none'; roomScreen.style.display = 'block';
        });
        document.getElementById('btn-escape').addEventListener('click', () => {
            catCurrentHP = catMaxHP; bossCurrentHP = bossMaxHP; updateHPBar();
            battleScreen.style.display = 'none'; roomScreen.style.display = 'block';
        });

        // 商店
        document.getElementById('buy-atk').addEventListener('click', () => {
            if (coins >= 200) { 
                coins -= 200; score += 15; 
                coinsDisplay.innerText = coins; scoreDisplay.innerText = score; 
                refreshTotalPower();
                alert('✨ 攻擊力永久 +15！'); 
            } else alert('貓幣不夠喔！');
        });
        document.getElementById('buy-hp').addEventListener('click', () => {
            if (coins >= 300) { 
                coins -= 300; catMaxHP += 50; catCurrentHP = catMaxHP; 
                coinsDisplay.innerText = coins; maxHpDisplay.innerText = catMaxHP; 
                refreshTotalPower();
                alert(`✨ 最大血量提升到 ${catMaxHP}！`); 
            } else alert('貓幣不夠喔！');
        });
        document.getElementById('buy-auto').addEventListener('click', () => {
            if (coins >= 800) {
                coins -= 800; roommates += 1; coinsDisplay.innerText = coins;
                autoStatus.style.display = 'inline'; autoStatus.innerText = `(💻x${roommates})`;
                alert(`✨ 成功聘用爆肝室友！`);
            } else alert('貓幣不夠喔！');
        });

        // 戰鬥邏輯
        document.getElementById('btn-attack').addEventListener('click', () => {
            if(bossCurrentHP <= 0 || catCurrentHP <= 0) return; 
            
            let damage = score + Math.floor(Math.random() * 10);
            bossCurrentHP -= damage; if(bossCurrentHP < 0) bossCurrentHP = 0;
            battleLog.innerText = `🐾 貓咪使出亂抓！對大魔王造成 ${damage} 點傷害！`;
            bossImg.classList.add('shake'); setTimeout(() => bossImg.classList.remove('shake'), 300);
            updateHPBar();

            // 打贏結算與魔王升級
            if (bossCurrentHP <= 0) {
                battleLog.innerText = "✨ 大魔王碎裂了！掉落了 500 貓幣！";
                setTimeout(() => {
                    bossLevel++;
                    bossMaxHP += 150;      
                    bossBaseDamage += 8;   
                    
                    // ★ 配合新公式，每次魔王升級，推薦戰力只增加 100 ★
                    recommendPowerValue += 100;
                    recPowerDisplay.innerText = recommendPowerValue;
                    refreshTotalPower(); 
                    
                    bossNameDisplay.innerText = `死當大魔王 Lv.${bossLevel}`;
                    
                    alert(`🎉 恭喜打倒魔王！💰 獲得 500 貓幣！\n⚠️ 魔王進化為 Lv.${bossLevel}，推薦戰力提升至 ${recommendPowerValue}！`);
                    
                    coins += 500; coinsDisplay.innerText = coins;
                    bossCurrentHP = bossMaxHP; catCurrentHP = catMaxHP; updateHPBar();
                    battleScreen.style.display = 'none'; roomScreen.style.display = 'block';
                }, 800);
                return;
            }

            // 魔王反擊 
            setTimeout(() => {
                let bossDamage = bossBaseDamage + Math.floor(Math.random() * 10);
                catCurrentHP -= bossDamage; if(catCurrentHP < 0) catCurrentHP = 0;
                battleLog.innerText = `💥 Lv.${bossLevel} 魔王重擊！你受到了 ${bossDamage} 點傷害！`;
                battleCatImg.classList.add('shake'); setTimeout(() => battleCatImg.classList.remove('shake'), 300);
                updateHPBar();

                if (catCurrentHP <= 0) {
                    setTimeout(() => {
                        alert("💀 慘遭死當... 被踢回小窩吧！");
                        catCurrentHP = catMaxHP; bossCurrentHP = bossMaxHP; updateHPBar();
                        battleScreen.style.display = 'none'; roomScreen.style.display = 'block';
                    }, 800);
                }
            }, 800);
        });

        // 補血
        document.getElementById('btn-heal').addEventListener('click', () => {
            if(bossCurrentHP <= 0 || catCurrentHP <= 0) return;
            catCurrentHP += 40; if(catCurrentHP > catMaxHP) catCurrentHP = catMaxHP;
            battleLog.innerText = `🥫 喝下冰美式，恢復 40 點 HP！`; updateHPBar();
            
            setTimeout(() => {
                let bossDamage = bossBaseDamage + Math.floor(Math.random() * 10);
                catCurrentHP -= bossDamage; if(catCurrentHP < 0) catCurrentHP = 0;
                battleLog.innerText = `💥 喝咖啡被偷襲！受到 ${bossDamage} 點傷害！`;
                battleCatImg.classList.add('shake'); setTimeout(() => battleCatImg.classList.remove('shake'), 300); updateHPBar();
                if (catCurrentHP <= 0) {
                    setTimeout(() => {
                        alert("💀 嗆死... 被踢回小窩！");
                        catCurrentHP = catMaxHP; bossCurrentHP = bossMaxHP; updateHPBar();
                        battleScreen.style.display = 'none'; roomScreen.style.display = 'block';
                    }, 800);
                }
            }, 800);
        });

        // 遊戲啟動時先算一次戰力
        recPowerDisplay.innerText = recommendPowerValue;
        refreshTotalPower();
    </script>
</body>
</html>
